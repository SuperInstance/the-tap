# The Tap — Wrangler Configuration
# Cloudflare-native deployment for The Tap tavern system
#
# Deploy: wrangler deploy
# Dev:    wrangler dev

name = "the-tap"
main = "workers/tap-gateway/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────
# Observability
# ──────────────────────────────────────────────
[observability]
enabled = true

# ──────────────────────────────────────────────
# Durable Objects
# ──────────────────────────────────────────────
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomState"

[[durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomState"]

# ──────────────────────────────────────────────
# D1 Databases
# ──────────────────────────────────────────────
[[d1_databases]]
binding = "TAP_DB"
database_name = "tap-db"
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"

# ──────────────────────────────────────────────
# R2 Buckets
# ──────────────────────────────────────────────
[[r2_buckets]]
binding = "TAP_ASSETS"
bucket_name = "tap-assets"

# ──────────────────────────────────────────────
# KV Namespaces
# ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "TAP_CONFIG"
id = "PLACEHOLDER_RUN_WRANGLER_KV_CREATE"

[[kv_namespaces]]
binding = "TAP_REFLEXES"
id = "PLACEHOLDER_RUN_WRANGLER_KV_CREATE"

# ──────────────────────────────────────────────
# Vectorize
# ──────────────────────────────────────────────
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "tap-memory"
dimensions = 384
metric = "cosine"

# ──────────────────────────────────────────────
# Workers AI
# ──────────────────────────────────────────────
[ai]
binding = "AI"

# ──────────────────────────────────────────────
# Service Bindings (Worker-to-Worker)
# ──────────────────────────────────────────────
[[services]]
binding = "PINCHER"
service = "the-tap-pincher"

[[services]]
binding = "LEVEL_RUNNER"
service = "the-tap-level-runner"

# ──────────────────────────────────────────────
# Cron Triggers
# ──────────────────────────────────────────────
[triggers]
crons = [
  "*/5 * * * * *",   # Every 5 seconds: room tick (wake all rooms)
]

# ──────────────────────────────────────────────
# Environment Variables
# ──────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
DEFAULT_ROOM = "bar-rail"
TICK_INTERVAL_MS = "5000"
MAX_CONVERSATION_LINES = "200"
PINCHER_EXECUTE_THRESHOLD = "0.90"
PINCHER_CONFIRM_THRESHOLD = "0.60"
JEPA_VECTOR_DIMS = "512"

# ──────────────────────────────────────────────
# Secrets (set via: wrangler secret put <NAME>)
# ──────────────────────────────────────────────
# TAP_AUTH_SECRET    — authentication token for browser/terminal connections
# CNS_BRIDGE_URL     — URL for cns-bridge fleet integration
# CNS_BRIDGE_TOKEN   — auth token for cns-bridge
# FLEET_WIKI_URL     — URL for fleet-wiki API
# FLEET_DASHBOARD_URL — URL for fleet-dashboard API


# ═══════════════════════════════════════════════
# PINCHER WORKER (separate deployment)
# ═══════════════════════════════════════════════

# Deploy separately: wrangler deploy --config wrangler.pincher.toml
# Or use the environments below

# ──────────────────────────────────────────────
# Environments
# ──────────────────────────────────────────────

[env.dev]
name = "the-tap-dev"
main = "workers/tap-gateway/src/index.ts"
vars = { ENVIRONMENT = "dev", TICK_INTERVAL_MS = "2000" }
